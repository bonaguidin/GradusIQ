[project]
name = "gradus-iq"
version = "0.1.0"
description = "AI-powered career and academic companion for Texas A&M students"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.111.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "supabase>=2.31.0",
    "tavily-python>=0.7.26",
    "uvicorn[standard]>=0.50.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    # Test-only: generates the PDF fixtures in tests/test_resume_extraction.py.
    # Never imported by GradusIQ_career/ -- pypdf reads PDFs, reportlab writes
    # them, and only the tests need to write one.
    "reportlab>=4.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
